<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Asset</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f1f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:500px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 18px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
}

.back-btn:hover{
    background:#1d4ed8;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#0f172a;
}

input,
select{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<div class="container">

<a href="/assets" class="back-btn">
← Back To Assets
</a>

<h1>✏ Edit Asset</h1>

<form th:action="@{/update-asset}" method="post">

<input type="hidden"
    name="id"
    th:value="${asset.id}">

<input type="text"
    name="assetName"
    th:value="${asset.assetName}"
    placeholder="Asset Name"
    required>

<input type="text"
    name="category"
    th:value="${asset.category}"
    placeholder="Category"
    required>

<select name="status">

<option value="Available"
        th:selected="${asset.status == 'Available'}">
Available
</option>

<option value="Assigned"
        th:selected="${asset.status == 'Assigned'}">
Assigned
</option>

<option value="Maintenance"
        th:selected="${asset.status == 'Maintenance'}">
Maintenance
</option>

</select>

<button type="submit">
Update Asset
</button>

</form>

</div>

</body>

</html>
