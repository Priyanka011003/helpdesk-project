<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Ticket</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#eef2ff;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:450px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#222;
        }

        input,
        select{
            width:100%;
            padding:14px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color:#2563eb;
            box-shadow:0 0 5px rgba(37,99,235,0.3);
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }
        .back-btn{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 18px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
    transition:0.3s;
}

.back-btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

    </style>

</head>

<body>

<div class="container">
<a href="/dashboard" class="back-btn">
    ← Back to Dashboard
</a>
    <h1>Edit Ticket</h1>

    <form th:action="@{/update-ticket}" method="post">
        <!-- HIDDEN ID -->

        <input type="hidden"
               name="id"
               th:value="${ticket.id}"/>

        <!-- TITLE -->

        <input type="text"
               name="title"
               th:value="${ticket.title}"
               placeholder="Enter Ticket Title"
               required>

        <!-- DESCRIPTION -->

        <input type="text"
               name="description"
               th:value="${ticket.description}"
               placeholder="Enter Description"
               required>

        <!-- PRIORITY -->

        <select name="priority">

            <option value="Low"
                    th:selected="${ticket.priority == 'Low'}">

                Low

            </option>

            <option value="Medium"
                    th:selected="${ticket.priority == 'Medium'}">

                Medium

            </option>

            <option value="High"
                    th:selected="${ticket.priority == 'High'}">

                High

            </option>

        </select>

        <!-- STATUS -->

        <select name="status">

            <option value="Pending"
                    th:selected="${ticket.status == 'Pending'}">

                Pending

            </option>

            <option value="Resolved"
                    th:selected="${ticket.status == 'Resolved'}">

                Resolved

            </option>

        </select>

        <!-- BUTTON -->

        <button type="submit">

            Update Ticket

        </button>

    </form>

</div>

</body>

</html>
