<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartDesk Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
}

.container{
    width:1000px;
    height:600px;
    display:flex;
    border-radius:25px;
    overflow:hidden;
    background:white;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
}

/* LEFT PANEL */

.left{
    flex:1;
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    color:white;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{
    font-size:80px;
    margin-bottom:20px;
}

.left h1{
    font-size:54px;
    margin-bottom:20px;
}

.left p{
    line-height:1.9;
    font-size:18px;
}

/* RIGHT PANEL */

.right{
    flex:1;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.right h2{
    font-size:42px;
    color:#0f172a;
    margin-bottom:10px;
}

.subtitle{
    color:#64748b;
    margin-bottom:25px;
}

/* FORM */

.input-group{
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:15px;
    border:2px solid #e2e8f0;
    border-radius:12px;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    outline:none;
    border-color:#2563eb;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#1d4ed8;
}

/* FORGOT PASSWORD */

.forgot-password{
    text-align:right;
    margin-bottom:20px;
}

.forgot-password a{
    text-decoration:none;
    color:#2563eb;
    font-size:14px;
    font-weight:500;
}

.forgot-password a:hover{
    text-decoration:underline;
}

/* ALERTS */

.success-message{
    background:#dcfce7;
    color:#166534;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

.error-message{
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

/* INFO BOX */

.demo{
    margin-top:25px;
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
    border-left:4px solid #2563eb;
    color:#0f172a;
}

/* FOOTER */

.footer{
    margin-top:20px;
    text-align:center;
    color:#64748b;
    font-size:13px;
}

/* RESPONSIVE */

@media(max-width:900px){

    .container{
        width:95%;
        height:auto;
        flex-direction:column;
    }

    .left,
    .right{
        padding:40px;
    }

    .left h1{
        font-size:42px;
    }
}
.password-box{
    position:relative;
}

.password-box input{
    padding-right:50px;
}

.eye-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:20px;
    user-select:none;
}

</style>

</head>

<body>

<div class="container">

    <!-- LEFT SECTION -->

    <div class="left">

        <div class="logo">🎫</div>

        <h1>SmartDesk</h1>

        <p>

            Helpdesk Ticket Management System

            <br><br>

            ✓ Ticket Management

            <br>

            ✓ Asset Management

            <br>

            ✓ Reports & Analytics

            <br>

            ✓ Admin Dashboard

            <br>

            ✓ Excel & PDF Export

        </p>

    </div>

    <!-- RIGHT SECTION -->

    <div class="right">

        <h2>Admin Login</h2>

        <p class="subtitle">
            Welcome Back! Please login to continue.
        </p>

        <div th:if="${success}"
             class="success-message">

            <span th:text="${success}"></span>

        </div>

        <div th:if="${error}"
             class="error-message">

            <span th:text="${error}"></span>

        </div>

        <form action="/login" method="post">

            <div class="input-group">

                <input type="text"
                       name="username"
                       placeholder="👤 Username"
                       required>

            </div>

            <div class="input-group password-box">

    <input type="password"
           id="password"
           name="password"
           placeholder="🔒 Password"
           required>

    <span class="eye-icon"
          onclick="togglePassword()">

        👁️

    </span>

</div>
            <div class="forgot-password">

                <a href="/forgot-password">
                    Forgot Password?
                </a>

            </div>

            <button type="submit"
                    class="login-btn">

                Login

            </button>

        </form>

        

        <div class="footer">

            SmartDesk v1.0 Enterprise

            
        </div>

    </div>

</div>
<script>

function togglePassword() {

    let password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";
    }
}

</script>
</body>

</html>
