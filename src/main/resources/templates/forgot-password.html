<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Forgot Password</title>

<style>

body{
    font-family:Poppins,sans-serif;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    width:400px;
}

input{
    width:100%;
    height:50px;
    padding:0 15px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    background:white;
    margin-bottom:15px;
    box-sizing:border-box;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}
button{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}
.password-box{
    position:relative;
    width:100%;
    margin-bottom:15px;
}

.password-box input{
    width:100%;
    height:50px;
    padding:0 45px 0 15px;
    border:1px solid #d1d5db;
    border-radius:10px;
    box-sizing:border-box;
}


.eye-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
    color:#64748b;
}
.back-btn{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}
.back-btn:hover{
    text-decoration:underline;
}

.card{
    width:450px;
    background:white;
    padding:45px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

</style>

</head>

<body>

<div class="card">

<div style="text-align:center;margin-bottom:25px;">

    <div style="font-size:50px;">🔐</div>

    <h2>Reset Password</h2>

    <p style="color:#64748b;">
        Create a new password for your account
    </p>

</div>

<form action="/reset-password"
      method="post">

<input type="text"
       name="username"
       placeholder="Username"
       required>

<div class="password-box">

    <input type="password"
           id="newPassword"
           name="newPassword"
           placeholder="🔒 New Password"
           required>

    <span class="eye-icon"
          onclick="togglePassword()">

        👁️

    </span>

</div>
<div class="password-box">

    <input type="password"
           id="confirmPassword"
           name="confirmPassword"
           placeholder="🔒 Confirm Password"
           required>

</div>

<button type="submit">

Update Password

</button>
<a href="/login" class="back-btn">

    ← Back To Login

</a>
</form>

</div>
<script>

function togglePassword(){

    let password =
        document.getElementById("newPassword");

    if(password.type === "password"){

        password.type = "text";

    }else{

        password.type = "password";
    }
}

</script>
</body>

</html>
