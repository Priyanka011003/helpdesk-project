<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reports Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#f1f5f9,#e2e8f0);
    font-family:'Poppins',sans-serif;
    margin:0;
    padding:0;
}

.main{
    max-width:1400px;
    margin:auto;
    padding:40px;
}

/* DASHBOARD BUTTON */

.dashboard-btn{
    display:inline-block;
    margin-bottom:25px;
    padding:12px 22px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.dashboard-btn:hover{
    transform:translateY(-3px);
}

/* HEADER */

.header h1{
    font-size:42px;
    color:#0f172a;
    margin-bottom:10px;
}

.header p{
    color:#64748b;
    margin-bottom:30px;
}

/* CARDS */

.cards{
    display:flex;
    gap:20px;
    margin-bottom:35px;
}

.card{
    flex:1;
    color:white;
    padding:30px;
    border-radius:24px;
    position:relative;
    overflow:hidden;
    box-shadow:0 15px 30px rgba(0,0,0,0.12);
}

.card::before{
    content:'';
    position:absolute;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    top:-35px;
    right:-35px;
}

.blue{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.green{
    background:linear-gradient(135deg,#16a34a,#4ade80);
}

.orange{
    background:linear-gradient(135deg,#ea580c,#fb923c);
}

.red{
    background:linear-gradient(135deg,#dc2626,#ef4444);
}

.card h3{
    margin:0 0 15px;
    font-size:24px;
}

.card p{
    font-size:55px;
    font-weight:700;
    margin:0;
}

/* REPORT TABLE */

.table-box{
    background:white;
    padding:25px;
    border-radius:24px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.table-box h2{
    margin-top:0;
    margin-bottom:20px;
    color:#0f172a;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#0f172a;
}

th{
    color:white;
    padding:18px;
    text-align:left;
}

td{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
}

tbody tr:hover{
    background:#f8fafc;
}

/* STATUS */

.status{
    padding:8px 16px;
    border-radius:25px;
    font-weight:600;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.resolved{
    background:#dcfce7;
    color:#166534;
}

/* RESPONSIVE */

@media(max-width:1000px){

    .cards{
        flex-direction:column;
    }

    .main{
        padding:20px;
    }

    .table-box{
        overflow-x:auto;
    }

    table{
        min-width:700px;
    }
}
.report-actions{
    margin-bottom:20px;
    display:flex;
    gap:15px;
}

.excel-btn,
.pdf-btn{
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    font-weight:600;
}

.excel-btn{
    background:#16a34a;
}

.pdf-btn{
    background:#dc2626;
}

</style>

</head>

<body>

<div class="main">

<a href="/dashboard" class="dashboard-btn">
← Back To Dashboard
</a>

<div class="header">

<h1>📊 Reports Dashboard</h1>

<p>Monitor ticket performance and support statistics</p>

</div>

<div class="cards">

<div class="card blue">
<h3>Total Tickets</h3>
<p th:text="${totalTickets}">0</p>
</div>

<div class="card green">
<h3>Resolved Tickets</h3>
<p th:text="${resolvedTickets}">0</p>
</div>

<div class="card orange">
<h3>Pending Tickets</h3>
<p th:text="${pendingTickets}">0</p>
</div>

<div class="card red">
<h3>High Priority</h3>
<p th:text="${highPriorityTickets}">0</p>
</div>

</div>

<div class="table-box">
<div class="report-actions">

    <a href="/reports/excel" class="excel-btn">
        📊 Download Excel
    </a>

    <a href="/reports/pdf" class="pdf-btn">
        📄 Download PDF
    </a>

</div>
<h2>Ticket Report</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Issue</th>
<th>Status</th>
<th>Priority</th>
</tr>
</thead>

<tbody>

<tr th:each="ticket : ${tickets}">

<td th:text="${ticket.id}"></td>

<td th:text="${ticket.title}"></td>

<td>
<span class="status"
      th:classappend="${ticket.status=='Resolved'} ? ' resolved' : ' pending'"
      th:text="${ticket.status}">
</span>
</td>

<td th:text="${ticket.priority}"></td>

</tr>

</tbody>

</table>

</div>

</div>

</body>
</html>
