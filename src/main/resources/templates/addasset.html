<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add Asset</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.form-box{
    width:450px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.form-box h1{
    margin-bottom:25px;
    color:#0f172a;
}

.form-box input,
.form-box select{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:12px;
}

.form-box button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

.form-box button:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<div class="form-box">

<h1>
<i class="fa-solid fa-laptop"></i>
Add Asset
</h1>

<form action="/saveasset"
method="post">

<input type="text"
       name="assetName"
       placeholder="Asset Name"
       required>

<input type="text"
       name="serialNo"
       placeholder="Serial Number"
       required>

<select name="status">

<option>Available</option>
<option>Assigned</option>
<option>Maintenance</option>

</select>

<input type="text"
       name="assignedTo"
       placeholder="Assigned To"
       required>
<button type="submit">

Save Asset

</button>

</form>

</div>

</body>

</html>
