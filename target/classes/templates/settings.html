<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fc;
    transition:0.3s;
}

/* DARK MODE */

.dark-mode{
    background:#0f172a;
    color:white;
}

.dark-mode .settings-box{
    background:#1e293b;
    color:white;
}

.dark-mode input,
.dark-mode select{
    background:#0f172a;
    color:white;
    border:1px solid #334155;
}

.dark-mode p,
.dark-mode span,
.dark-mode h1,
.dark-mode h2,
.dark-mode h3{
    color:white;
}

/* MAIN */

.main{
    padding:40px;
}

/* HEADER */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.page-header h1{
    font-size:40px;
    color:#0f172a;
}

/* SETTINGS GRID */

.settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

/* BOX */

.settings-box{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    transition:0.3s;
}

.settings-box h2{
    margin-bottom:25px;
    color:#0f172a;
}

/* INPUTS */

.settings-box input,
.settings-box select{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:12px;
    font-size:15px;
}

/* BUTTON */

.settings-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.settings-box button:hover{
    background:#1d4ed8;
}

/* PROFILE */

.profile-card{
    text-align:center;
}

.profile-icon{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#2563eb;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:40px;
    margin-bottom:20px;
}

.profile-card h3{
    margin-bottom:8px;
}

.profile-card p{
    color:gray;
}

/* SWITCH */

.switch-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.switch{
    position:relative;
    display:inline-block;
    width:55px;
    height:28px;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.slider{
    position:absolute;
    cursor:pointer;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:#ccc;
    transition:.4s;
    border-radius:34px;
}

.slider:before{
    position:absolute;
    content:"";
    height:22px;
    width:22px;
    left:3px;
    bottom:3px;
    background:white;
    transition:.4s;
    border-radius:50%;
}

input:checked + .slider{
    background:#2563eb;
}

input:checked + .slider:before{
    transform:translateX(26px);
}

/* PASSWORD BOX */

.password-box{
    position:relative;
    margin-bottom:18px;
}

.password-box input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:12px;
    font-size:15px;
}

.password-box i{
    position:absolute;
    right:15px;
    top:18px;
    cursor:pointer;
    color:gray;
}

/* PASSWORD STRENGTH */

.strength-meter{
    width:100%;
    height:8px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-top:-5px;
    margin-bottom:10px;
}

#strengthBar{
    height:100%;
    width:0%;
    transition:0.3s;
}

#strengthText{
    font-size:14px;
    margin-bottom:15px;
}

/* MOBILE */

@media(max-width:900px){

    .settings-grid{
        grid-template-columns:1fr;
    }

}
.dashboard-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    padding:12px 22px;
    border-radius:12px;
    font-weight:600;
    box-shadow:0 5px 15px rgba(37,99,235,.3);
    transition:.3s;
}

.dashboard-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(37,99,235,.4);
}

</style>

</head>

<body>

<div class="main">

<!-- HEADER -->

<div class="page-header">
<div style="margin-bottom:25px;">

    <a href="/dashboard" class="dashboard-btn">

        <i class="fa-solid fa-arrow-left"></i>
        Back To Dashboard

    </a>

</div>
<h1>
<i class="fa-solid fa-gear"></i>
Settings
</h1>

</div>

<!-- SETTINGS GRID -->

<div class="settings-grid">

<!-- CHANGE PASSWORD -->

<div class="settings-box">

<h2>
<i class="fa-solid fa-lock"></i>
Change Password
</h2>

<form action="/update-password"
method="post">

<!-- OLD PASSWORD -->

<div class="password-box">

<input type="password"
       id="oldPassword"
       name="oldPassword"
       placeholder="Old Password"
       required>

<i class="fa-solid fa-eye"
   onclick="togglePassword('oldPassword', this)"></i>

</div>

<!-- NEW PASSWORD -->

<div class="password-box">

<input type="password"
       id="newPassword"
       name="newPassword"
       placeholder="New Password"
       required>

<i class="fa-solid fa-eye"
   onclick="togglePassword('newPassword', this)"></i>

</div>

<!-- STRENGTH -->

<div class="strength-meter">

<div id="strengthBar"></div>

</div>

<p id="strengthText"></p>

<button type="submit">

Update Password

</button>

</form>

</div>

<!-- PROFILE -->

<div class="settings-box profile-card">

<div class="profile-icon">

<i class="fa-solid fa-user"></i>

</div>

<h3>Administrator</h3>

<p>SmartDesk IT Support Manager</p>

<br>

<div style="display:flex;
            justify-content:center;
            gap:10px;
            flex-wrap:wrap;">

    <span style="
    background:#dbeafe;
    color:#2563eb;
    padding:8px 14px;
    border-radius:20px;">
    Admin
    </span>

    <span style="
    background:#dcfce7;
    color:#16a34a;
    padding:8px 14px;
    border-radius:20px;">
    Active
    </span>

</div>
</div>

<!-- PREFERENCES -->

<div class="settings-box">

<h2>
<i class="fa-solid fa-sliders"></i>
Preferences
</h2>

<div class="switch-box">

<span>Email Notifications</span>

<label class="switch">

<input type="checkbox" checked>

<span class="slider"></span>

</label>

</div>

<div class="switch-box">

<span>Dark Mode</span>

<label class="switch">

<input type="checkbox"
       id="darkModeToggle">

<span class="slider"></span>

</label>

</div>

<div class="switch-box">

<span>Auto Resolve Alerts</span>

<label class="switch">

<input type="checkbox" checked>

<span class="slider"></span>

</label>

</div>

</div>

<!-- SYSTEM INFO -->

<div class="settings-box">

<h2>
<i class="fa-solid fa-circle-info"></i>
System Information
</h2>

<p><strong>Application:</strong> SmartDesk</p>

<br>

<p><strong>Version:</strong> 1.0 Enterprise</p>

<br>

<p><strong>Database:</strong> PostgreSQL</p>

<br>

<p><strong>Framework:</strong> Spring Boot 3</p>

</div>

</div>

</div>

<script>

/* DARK MODE */

const darkToggle =
document.getElementById("darkModeToggle");

if(localStorage.getItem("darkMode") === "enabled"){

    document.body.classList.add("dark-mode");

    darkToggle.checked = true;

}

darkToggle.addEventListener("change", function(){

    if(this.checked){

        document.body.classList.add("dark-mode");

        localStorage.setItem(
            "darkMode",
            "enabled"
        );

    }else{

        document.body.classList.remove("dark-mode");

        localStorage.setItem(
            "darkMode",
            "disabled"
        );

    }

});

/* SHOW PASSWORD */

function togglePassword(id, icon){

    const input =
    document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    }else{

        input.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}

/* PASSWORD STRENGTH */

const passwordInput =
document.getElementById("newPassword");

const strengthBar =
document.getElementById("strengthBar");

const strengthText =
document.getElementById("strengthText");

passwordInput.addEventListener("input", function(){

    const value = passwordInput.value;

    let strength = 0;

    if(value.length >= 6) strength++;

    if(/[A-Z]/.test(value)) strength++;

    if(/[0-9]/.test(value)) strength++;

    if(/[^A-Za-z0-9]/.test(value)) strength++;

    if(strength === 1){

        strengthBar.style.width = "25%";
        strengthBar.style.background = "red";
        strengthText.innerText = "Weak Password";

    }
    else if(strength === 2){

        strengthBar.style.width = "50%";
        strengthBar.style.background = "orange";
        strengthText.innerText = "Medium Password";

    }
    else if(strength === 3){

        strengthBar.style.width = "75%";
        strengthBar.style.background = "#2563eb";
        strengthText.innerText = "Strong Password";

    }
    else if(strength === 4){

        strengthBar.style.width = "100%";
        strengthBar.style.background = "#16a34a";
        strengthText.innerText = "Very Strong Password";

    }
    else{

        strengthBar.style.width = "0%";
        strengthText.innerText = "";

    }

});


</script>
<p th:if="${success}"
	   style="color:green;
	          margin-bottom:15px;">

	    <span th:text="${success}"></span>

	</p>

	<p th:if="${error}"
	   style="color:red;
	          margin-bottom:15px;">

	    <span th:text="${error}"></span>

	</p>
</body>

</html>
