<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asset Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background:#f1f5f9;
    margin:0;
}

.container{
    padding:40px;
}

/* HEADER */

.header h1{
    color:#0f172a;
    font-size:40px;
    margin-bottom:20px;
}

/* DASHBOARD BUTTON */

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    padding:12px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.back-btn:hover{
    background:#1d4ed8;
}

/* CARDS */

.cards{
    display:flex;
    gap:20px;
    margin-top:20px;
    margin-bottom:30px;
}

.card{
    flex:1;
    color:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.blue{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.green{
    background:linear-gradient(135deg,#16a34a,#4ade80);
}

.orange{
    background:linear-gradient(135deg,#ea580c,#fb923c);
}

.red{
    background:linear-gradient(135deg,#dc2626,#ef4444);
}

.card h3{
    margin:0;
    font-size:20px;
}

.card p{
    font-size:42px;
    font-weight:bold;
    margin-top:15px;
}

/* FORM */

.asset-form{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:30px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.asset-form h2{
    margin-top:0;
    color:#0f172a;
}

.asset-form form{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.asset-form input,
.asset-form select{
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    min-width:180px;
}

.asset-form button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.asset-form button:hover{
    background:#1d4ed8;
}

/* TABLE */

table{
    width:100%;
    background:white;
    border-collapse:collapse;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

th{
    background:#0f172a;
    color:white;
    padding:16px;
    text-align:left;
}

td{
    padding:16px;
    border-bottom:1px solid #e5e7eb;
}

tbody tr:hover{
    background:#f8fafc;
}

/* BUTTONS */

.edit-btn{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}

.delete-btn{
    color:#dc2626;
    text-decoration:none;
    font-weight:600;
}

/* RESPONSIVE */

@media(max-width:900px){

    .cards{
        flex-direction:column;
    }

    .asset-form form{
        flex-direction:column;
    }

    table{
        display:block;
        overflow-x:auto;
    }

}
.success-message{

    background:#dcfce7;
    color:#166534;
    padding:15px 20px;
    border-radius:12px;
    margin:20px;
    font-weight:600;
    border-left:5px solid #16a34a;
}

.error-message{

    background:#fee2e2;
    color:#991b1b;
    padding:15px 20px;
    border-radius:12px;
    margin:20px;
    font-weight:600;
    border-left:5px solid #dc2626;
}
.search-form{
    display:flex;
    gap:12px;
    margin:20px 0;
}

.search-form input{
    width:300px;
    padding:12px;
    border:none;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.search-form button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:600;
}

.no-record{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:10px;
    margin:20px 0;
}

</style>

</head>

<body>
<div th:if="${success}"
     class="success-message">

    <span th:text="${success}"></span>

</div>
<div th:if="${message}"
     class="no-record">

    <span th:text="${message}"></span>

</div>
<div th:if="${error}"
     class="error-message">

    <span th:text="${error}"></span>

</div>
<div class="container">

<a href="/dashboard" class="back-btn">
← Back To Dashboard
</a>

<div class="header">

<h1>💻 Asset Management</h1>

</div>
<form action="/assets/search"
      method="get"
      class="search-form">

    <input type="text"
           name="keyword"
           placeholder="🔍 Search Asset">

    <button type="submit">
        Search
    </button>

</form>
<!-- CARDS -->

<div class="cards">

<div class="card blue">
<h3>Total Assets</h3>
<p th:text="${totalAssets}">0</p>
</div>

<div class="card green">
<h3>Available</h3>
<p th:text="${availableAssets}">0</p>
</div>

<div class="card orange">
<h3>Assigned</h3>
<p th:text="${assignedAssets}">0</p>
</div>

<div class="card red">
<h3>Maintenance</h3>
<p th:text="${maintenanceAssets}">0</p>
</div>

</div>

<!-- ADD ASSET -->

<div class="asset-form">

<h2>Add New Asset</h2>

<form action="/save-asset" method="post">

<input type="text"
    name="assetId"
    placeholder="Asset ID"
    required>

<input type="text"
    name="assetName"
    placeholder="Asset Name"
    required>

<input type="text"
    name="category"
    placeholder="Category"
    required>
<input type="text"
       name="assignedTo"
       placeholder="Assigned To">

<input type="text"
       name="department"
       placeholder="Department">

<input type="text"
       name="employeeId"
       placeholder="Employee ID">
<select name="status">

<option value="Available">Available</option>

<option value="Assigned">Assigned</option>

<option value="Maintenance">Maintenance</option>

</select>

<button type="submit">

Add Asset

</button>

</form>

</div>

<!-- TABLE -->

<table>

<thead>

<tr>

<th>Asset ID</th>
<th>Asset Name</th>
<th>Category</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="asset : ${assets}">

<td th:text="${asset.assetId}"></td>

<td th:text="${asset.assetName}"></td>

<td th:text="${asset.category}"></td>

<td th:text="${asset.status}"></td>

<td>

<a th:href="@{/edit-asset/{id}(id=${asset.id})}"
class="edit-btn">

Edit

</a>

|

<a th:href="@{/delete-asset/{id}(id=${asset.id})}"
onclick="return confirm('Delete this asset?')"
class="delete-btn">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
