<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Signup</title>

<link rel="stylesheet" href="/style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body.login-page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef2ff;
}

.login-box{
    width:420px;
    background:white;
    padding:45px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.login-box h2{
    text-align:center;
    margin-bottom:35px;
    font-size:48px;
    font-weight:700;
    color:#111827;
}

.login-box input[type="text"],
.login-box input[type="password"]{

    width:100%;
    padding:18px;
    margin-bottom:22px;
    border:1px solid #d1d5db;
    border-radius:14px;
    background:#eef2ff;
    font-size:16px;
    outline:none;
}

.login-box input:focus{
    border-color:#2563eb;
    background:white;
}

.show-password{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:25px;
}

.show-password input[type="checkbox"]{
    width:18px;
    height:18px;
    cursor:pointer;
}

.show-password label{
    font-size:16px;
    color:#374151;
    cursor:pointer;
}

.signup-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
}

.signup-btn:hover{
    background:#1d4ed8;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#4f46e5;
    text-decoration:none;
    font-size:16px;
    font-weight:500;
}

.back-link:hover{
    text-decoration:underline;
}

.error-msg{
    color:red;
    text-align:center;
    margin-bottom:20px;
}

</style>

<script>

function togglePassword() {

    var x =
    document.getElementById("password");

    if (x.type === "password") {

        x.type = "text";

    } else {

        x.type = "password";

    }

}

</script>

</head>

<body class="login-page">

<div class="login-box">

<h2>Create Account</h2>

<p th:if="${error}"
   th:text="${error}"
   class="error-msg">
</p>

<form th:action="@{/signup}" method="post">

<input type="text"
       name="username"
       placeholder="Enter Username"
       required>

<input type="password"
       id="password"
       name="password"
       placeholder="Enter Password"
       required>

<div class="show-password">

<input type="checkbox"
       onclick="togglePassword()">

<label>Show Password</label>

</div>

<button type="submit"
        class="signup-btn">

Sign Up

</button>

</form>

<a href="/login"
   class="back-link">

Back to Login

</a>

</div>

</body>

</html>
