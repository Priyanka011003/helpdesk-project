<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartDesk | IT Support Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f1f5f9;
    overflow-x:hidden;
}

/* WRAPPER */

.wrapper{
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    height:100vh;
    background:linear-gradient(180deg,#0f172a,#111827,#1e293b);
    position:fixed;
    left:0;
    top:0;
    padding:25px;
    color:white;
    box-shadow:5px 0 20px rgba(0,0,0,0.2);
}

.sidebar h2{
    text-align:center;
    margin-bottom:40px;
    font-size:32px;
    font-weight:700;
}

.sidebar ul{
    list-style:none;
    padding:0;
}

.sidebar ul li{
    margin-bottom:15px;
}

.sidebar ul li a{
    color:white;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    border-radius:12px;
    transition:0.3s;
    font-size:16px;
}

.sidebar ul li a:hover{
    background:#2563eb;
    transform:translateX(6px);
}

/* MAIN */

.main{
    margin-left:260px;
    width:calc(100% - 260px);
    padding:35px;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.topbar h1{
    font-size:42px;
    color:#0f172a;
    font-weight:700;
}

/* DASHBOARD GRID */

.dashboard-layout{
    display:grid;
    grid-template-columns:2fr 350px;
    gap:25px;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-bottom:25px;
}

.card-box{
    padding:30px;
    border-radius:25px;
    color:white;
    box-shadow:0 12px 25px rgba(0,0,0,0.15);
    transition:0.3s;
    cursor:pointer;
}

.card-box:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 35px rgba(0,0,0,0.2);
}

.card-box h3{
    font-size:22px;
    margin-bottom:15px;
}

.card-box p{
    font-size:60px;
    font-weight:700;
}

.blue{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.green{
    background:linear-gradient(135deg,#059669,#34d399);
}

.orange{
    background:linear-gradient(135deg,#d97706,#fbbf24);
}

.red{
    background:linear-gradient(135deg,#dc2626,#fb7185);
}

/* FORM BOX */

.form-box{
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.form-box h2{
    margin-bottom:20px;
    color:#0f172a;
}

.form-box input,
.form-box textarea,
.form-box select{
    width:100%;
    padding:14px;
    border:2px solid #e2e8f0;
    border-radius:12px;
    margin-bottom:15px;
    transition:0.3s;
}

.form-box input:focus,
.form-box textarea:focus,
.form-box select:focus{
    border-color:#2563eb;
    outline:none;
}

.form-box button{
    width:100%;
    padding:15px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.form-box button:hover{
    transform:scale(1.03);
}

/* TABLE */

.table-box{
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.table-box h2{
    margin-bottom:20px;
    color:#0f172a;
}

.table-box table{
    width:100%;
    border-collapse:collapse;
}

.table-box th{
    background:#0f172a;
    color:white;
    padding:18px;
    text-align:left;
}

.table-box td{
    padding:18px;
    border-bottom:1px solid #e2e8f0;
}

.table-box tr:hover{
    background:#f8fafc;
}

/* STATUS BADGES */

.status{
    padding:8px 15px;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
    color:white;
}

.status-resolved{
    background:#16a34a;
}

.status-pending{
    background:#f59e0b;
}

.status-open{
    background:#2563eb;
}

/* BUTTONS */

.action-btn{
    border:none;
    padding:10px 14px;
    border-radius:10px;
    color:white;
    transition:0.3s;
    cursor:pointer;
}

.action-btn:hover{
    transform:scale(1.1);
}

.edit{
    background:#2563eb;
}

.delete{
    background:#dc2626;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#2563eb;
    border-radius:20px;
}

/* MOBILE */

@media(max-width:992px){

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .dashboard-layout{
        grid-template-columns:1fr;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .topbar h1{
        font-size:28px;
    }

}
.action-buttons{
    display:flex;
    gap:10px;
    align-items:center;
}

.resolve{
    background:linear-gradient(135deg,#16a34a,#22c55e);
}

.edit{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.delete{
    background:linear-gradient(135deg,#dc2626,#ef4444);
}

.status{
    padding:8px 16px;
    border-radius:30px;
    display:inline-block;
}

.status-resolved{
    background:#dcfce7;
    color:#166534;
}

.status-pending{
    background:#fef3c7;
    color:#92400e;
}
.welcome-box{
    background:white;
    padding:15px 25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
    font-weight:600;
    color:#2563eb;
}

</style>

</head>

<body>

<div class="wrapper">

<!-- SIDEBAR -->

<div class="sidebar">

<h2>
<i class="fa-solid fa-headset"></i>
SmartDesk
</h2>

<ul>

<li>
<a href="/">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</a>
</li>

<li>
<a href="/tickets">
<i class="fa-solid fa-ticket"></i>
Tickets
</a>
</li>

<li>
<a href="/assets">
<i class="fa-solid fa-computer"></i>
Assets
</a>
</li>

<li>
<a href="/reports">
<i class="fa-solid fa-chart-pie"></i>
Reports
</a>
</li>

<li>
<a href="/settings">
<i class="fa-solid fa-gear"></i>
Settings
</a>
</li>

<li>
<a href="/logout">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</a>
</li>

</ul>

</div>

<!-- MAIN -->

<div class="main">
<div class="welcome-box">
    Welcome, Admin 👋
</div>
<div class="topbar">
<h1>🚀 SmartDesk IT Support Dashboard</h1>
</div>

<div class="dashboard-layout">

<!-- LEFT -->

<div>

<!-- CARDS -->

<div class="cards">

<div class="card-box blue">
<h3>🎫 Total Tickets</h3>
<p th:text="${totalTickets}"></p>
</div>

<div class="card-box green">
<h3>✅ Resolved Tickets</h3>
<p th:text="${resolvedTickets}"></p>
</div>

<div class="card-box orange">
<h3>⏳ Pending Tickets</h3>
<p th:text="${pendingTickets}"></p>
</div>

<div class="card-box red">
<h3>🔥 High Priority</h3>
<p th:text="${highPriorityTickets}"></p>
</div>

</div>

<!-- TABLE -->

<div class="table-box">

<h2>Recent Tickets</h2>

<table>

<tr>
<th>ID</th>
<th>Issue</th>
<th>Status</th>
<th>Priority</th>
<th>Action</th>
</tr>

<tr th:each="ticket : ${tickets}">

<td th:text="${ticket.id}"></td>

<td th:text="${ticket.title}"></td>

<td>

<span
th:class="${ticket.status == 'Resolved'} ?
'status status-resolved' :
'status status-pending'"
th:text="${ticket.status}">
</span>

</td>
<td th:text="${ticket.priority}"></td>

<td>

<div class="action-buttons">

<a th:href="@{/resolve/{id}(id=${ticket.id})}"
   class="action-btn resolve">
   <i class="fa-solid fa-check"></i>
</a>

<a th:href="@{/edit-ticket/{id}(id=${ticket.id})}"
   class="action-btn edit">
   <i class="fa-solid fa-pen"></i>
</a>

<a th:href="@{/delete-ticket/{id}(id=${ticket.id})}"
   onclick="return confirm('Delete this ticket?')"
   class="action-btn delete">
   <i class="fa-solid fa-trash"></i>
</a>

</div>

</td>

</tr>

</table>

</div>

</div>

<!-- RIGHT -->

<div>

<div class="form-box">

<h2>Create Support Ticket</h2>

<form action="/save" method="post">

<input type="text"
       name="title"
       placeholder="Issue Title"
       required>

<textarea
name="description"
placeholder="Describe issue..."
required></textarea>

<select name="priority">

<option>High</option>
<option>Medium</option>
<option>Low</option>

</select>

<button type="submit">

+ Create Ticket

</button>

</form>

</div>

</div>

</div>

</div>

</div>

<script>

if(localStorage.getItem("darkMode") === "enabled"){

    document.body.classList.add("dark-mode");

}

</script>

</body>

</html>
